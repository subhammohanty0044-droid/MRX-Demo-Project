<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Ready</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0e1a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; overflow-x: hidden; }
        .container { max-width: 400px; width: 100%; background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); padding: 40px 30px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.08); text-align: center; position: relative; z-index: 1; }
        .container h2 { font-size: 28px; background: linear-gradient(135deg, #00f0ff, #7a2be0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .container .sub { color: #aaa; font-size: 14px; margin-bottom: 25px; }
        .card-preview { background: linear-gradient(145deg, #1a1f2f, #0d111f); border-radius: 20px; padding: 25px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.06); }
        .card-preview .chip { font-size: 34px; text-align: left; }
        .card-preview .number { font-size: 22px; letter-spacing: 3px; margin: 15px 0 10px; font-weight: 600; color: #fff; }
        .card-preview .details { display: flex; justify-content: space-between; font-size: 14px; color: #ccc; }
        .balance { font-size: 36px; font-weight: 700; color: #2ed573; margin: 15px 0 25px; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 50px; background: linear-gradient(135deg, #00c8ff, #7a2be0); color: #fff; font-size: 18px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn:hover { transform: scale(1.02); box-shadow: 0 0 40px rgba(0,200,255,0.3); }
        .footer { margin-top: 20px; font-size: 12px; color: #555; }
    </style>
</head>
<body>

{% include 'earth-bg.html' %}

<div class="container">
    <h2>✅ Card Activated</h2>
    <div class="sub">Your virtual card is ready to use.</div>
    <div class="card-preview">
        <div class="chip">💳</div>
        <div class="number">7653 0584 4340 2005</div>
        <div class="details"><span>MRX BUDDY</span><span>20/05</span></div>
    </div>
    <div class="balance">₹8,000.00</div>
    <button class="btn" onclick="window.location.href='/page4'">Next →</button>
    <div class="footer">© 2026 Flixes — Educational project only</div>
</div>
</body>
</html>
