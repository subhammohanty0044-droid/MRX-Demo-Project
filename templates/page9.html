<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0e1a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; overflow-x: hidden; }
        .container { max-width: 400px; width: 100%; background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); padding: 40px 30px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.08); text-align: center; position: relative; z-index: 1; }
        .container h2 { font-size: 28px; background: linear-gradient(135deg, #00f0ff, #7a2be0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
        .container .sub { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        .support-box { background: rgba(255,255,255,0.04); border-radius: 20px; padding: 25px; margin: 20px 0; border: 1px solid rgba(255,255,255,0.06); }
        .support-box .icon { font-size: 48px; display: block; margin-bottom: 10px; }
        .support-box p { color: #94a3b8; font-size: 15px; line-height: 1.6; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 50px; background: linear-gradient(135deg, #00c8ff, #7a2be0); color: #fff; font-size: 18px; font-weight: 600; cursor: pointer; transition: 0.3s; text-decoration: none; display: inline-block; }
        .btn:hover { transform: scale(1.02); box-shadow: 0 0 40px rgba(0,200,255,0.3); }
        .trust-badges { display: flex; justify-content: center; gap: 30px; margin: 20px 0; }
        .trust-badges span { font-size: 13px; color: #94a3b8; }
        .footer { margin-top: 25px; font-size: 12px; color: #555; }
    </style>
</head>
<body>

{% include 'earth-bg.html' %}

<div class="container">
    <h2>💬 Need Help?</h2>
    <div class="sub">If you face any issue, feel free to contact us.</div>
    <div class="support-box"><span class="icon">📩</span><p>DM us anytime — we're here to help.</p></div>
    <a href="https://t.me/MRXBUDDY04" target="_blank" class="btn">📱 Contact Support</a>
    <div class="trust-badges"><span>🛡️ 24/7 Support</span><span>🔒 Secure & Private</span></div>
    <div class="footer">© 2026 Flixes — All rights reserved.</div>
</div>
</body>
</html>
