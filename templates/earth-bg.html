<style>
/* ===== DARK BACKGROUND ===== */
body {
    background: #080b16;
    overflow: hidden;
    position: relative;
}

/* ===== EARTH (Rotating) ===== */
.earth-bg {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 380px;
    height: 380px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 35% 35%, #1a8cff, #002244);
    border-radius: 50%;
    box-shadow: 0 0 120px rgba(0, 150, 255, 0.25);
    animation: spinEarth 25s linear infinite;
    z-index: 0;
    opacity: 0.25;
    pointer-events: none;
}

@keyframes spinEarth {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
}

/* ===== GLOWING RING 1 ===== */
.ring {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 520px;
    height: 520px;
    transform: translate(-50%, -50%);
    border: 1.5px solid rgba(0, 255, 255, 0.12);
    border-radius: 50%;
    animation: spinRing 30s linear infinite;
    z-index: -1;
    box-shadow: 0 0 60px rgba(0, 255, 255, 0.04);
}
.ring::before {
    content: '';
    position: absolute;
    top: -8px;
    left: 50%;
    width: 20px;
    height: 20px;
    background: rgba(0, 255, 255, 0.2);
    border-radius: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 30px rgba(0, 255, 255, 0.15);
}

/* ===== RING 2 (Reverse) ===== */
.ring2 {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 700px;
    height: 700px;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(0, 255, 255, 0.05);
    border-radius: 50%;
    animation: spinRing 40s linear infinite reverse;
    z-index: -1;
}

@keyframes spinRing {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
}

/* ===== GRID LINES ===== */
.grid {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
        linear-gradient(rgba(0, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.025) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: -1;
}

/* ===== PARTICLES (Glowing dots) ===== */
.particle {
    position: fixed;
    width: 3px;
    height: 3px;
    background: rgba(0, 255, 255, 0.35);
    border-radius: 50%;
    animation: floatUp 18s infinite linear;
    z-index: -1;
    pointer-events: none;
    box-shadow: 0 0 8px rgba(0, 255, 255, 0.15);
}

@keyframes floatUp {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}
</style>

<!-- ===== HTML ===== -->
<div class="grid"></div>
<div class="ring"></div>
<div class="ring2"></div>
<div class="earth-bg"></div>

<!-- ===== PARTICLES JS ===== -->
<script>
(function() {
    const body = document.body;
    for (let i = 0; i < 40; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (12 + Math.random() * 18) + 's';
        p.style.animationDelay = (Math.random() * 20) + 's';
        p.style.width = (2 + Math.random() * 4) + 'px';
        p.style.height = p.style.width;
        body.appendChild(p);
    }
})();
</script>
