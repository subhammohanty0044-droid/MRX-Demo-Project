<style>
/* ===== REAL 3D EARTH BACKGROUND ===== */
body {
    background: #080b16;
    overflow: hidden;
    position: relative;
    margin: 0;
    padding: 0;
    min-height: 100vh;
}

/* ===== EARTH GLOBE ===== */
.earth-container {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 400px;
    height: 400px;
    transform: translate(-50%, -50%);
    z-index: -1;
    pointer-events: none;
    opacity: 0.2;
}

.earth {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #1a8cff, #001a33);
    box-shadow: 
        inset -20px -20px 60px rgba(0,0,0,0.6),
        0 0 100px rgba(0, 150, 255, 0.15);
    animation: spinEarth 30s linear infinite;
    position: relative;
    overflow: hidden;
}

/* ===== LAND MASS (Fake continents) ===== */
.earth::before {
    content: '';
    position: absolute;
    top: 15%;
    left: 10%;
    width: 35%;
    height: 25%;
    background: radial-gradient(ellipse at 50% 50%, rgba(0, 200, 100, 0.3), transparent 70%);
    border-radius: 40% 60% 30% 70%;
    box-shadow: 0 0 20px rgba(0, 200, 100, 0.1);
}

.earth::after {
    content: '';
    position: absolute;
    bottom: 20%;
    right: 15%;
    width: 30%;
    height: 20%;
    background: radial-gradient(ellipse at 50% 50%, rgba(0, 200, 100, 0.2), transparent 70%);
    border-radius: 50% 30% 60% 40%;
    box-shadow: 0 0 20px rgba(0, 200, 100, 0.08);
}

/* ===== GLOW RING ===== */
.ring {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 520px;
    height: 520px;
    transform: translate(-50%, -50%);
    border: 1.5px solid rgba(0, 255, 255, 0.08);
    border-radius: 50%;
    animation: spinRing 35s linear infinite;
    z-index: -1;
    box-shadow: 0 0 80px rgba(0, 255, 255, 0.03);
}

.ring2 {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 680px;
    height: 680px;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(0, 255, 255, 0.04);
    border-radius: 50%;
    animation: spinRing 45s linear infinite reverse;
    z-index: -1;
}

/* ===== ANIMATIONS ===== */
@keyframes spinEarth {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

@keyframes spinRing {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
}

/* ===== GRID ===== */
.grid {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
        linear-gradient(rgba(0, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: -1;
}

/* ===== PARTICLES ===== */
.particle {
    position: fixed;
    width: 2px;
    height: 2px;
    background: rgba(0, 255, 255, 0.3);
    border-radius: 50%;
    animation: floatUp 18s infinite linear;
    z-index: -1;
    pointer-events: none;
    box-shadow: 0 0 6px rgba(0, 255, 255, 0.1);
}

@keyframes floatUp {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}
</style>

<!-- ===== HTML ===== -->
<div class="grid"></div>
<div class="ring"></div>
<div class="ring2"></div>

<div class="earth-container">
    <div class="earth"></div>
</div>

<!-- ===== PARTICLES JS ===== -->
<script>
(function() {
    const body = document.body;
    for (let i = 0; i < 50; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (12 + Math.random() * 20) + 's';
        p.style.animationDelay = (Math.random() * 20) + 's';
        p.style.width = (2 + Math.random() * 4) + 'px';
        p.style.height = p.style.width;
        body.appendChild(p);
    }
})();
</script>
