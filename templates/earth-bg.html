<!-- ===== EARTH BACKGROUND ===== -->
<style>
.earth-bg {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 500px;
    height: 500px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 35% 35%, #1a8cff, #002244);
    border-radius: 50%;
    box-shadow: 0 0 120px rgba(0, 150, 255, 0.25);
    animation: spinEarth 30s linear infinite;
    z-index: -1;
    opacity: 0.20;
    pointer-events: none;
}
.earth-glow {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 700px;
    height: 700px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(0, 150, 255, 0.10), transparent 70%);
    border-radius: 50%;
    z-index: -1;
    pointer-events: none;
}
@keyframes spinEarth {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
}
.particle {
    position: fixed;
    width: 3px;
    height: 3px;
    background: rgba(0, 200, 255, 0.3);
    border-radius: 50%;
    animation: floatUp 20s infinite linear;
    z-index: -1;
    pointer-events: none;
}
@keyframes floatUp {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}
</style>

<div class="earth-glow"></div>
<div class="earth-bg"></div>

<script>
(function() {
    const body = document.body;
    for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (12 + Math.random() * 20) + 's';
        p.style.animationDelay = (Math.random() * 20) + 's';
        p.style.width = (2 + Math.random() * 4) + 'px';
        p.style.height = p.style.width;
        body.appendChild(p);
    }
})();
</script>
