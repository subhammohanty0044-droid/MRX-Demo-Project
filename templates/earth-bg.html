<style>
/* ===== 3D EARTH + STARS BACKGROUND ===== */
body {
    background: #000000;
    overflow: hidden;
    position: relative;
    margin: 0;
    padding: 0;
    min-height: 100vh;
}

/* ===== STARS ===== */
.star {
    position: fixed;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s infinite ease-in-out alternate;
    z-index: -1;
    pointer-events: none;
}

@keyframes twinkle {
    0% { opacity: 0.2; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1.2); }
}

/* ===== 3D EARTH (Only one side visible) ===== */
.earth-container {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 420px;
    height: 420px;
    transform: translate(-50%, -50%);
    z-index: -1;
    pointer-events: none;
    opacity: 0.55;
    border-radius: 50%;
    box-shadow: 0 0 120px rgba(0, 150, 255, 0.15);
}

.earth {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, #1a8cff, #001a33);
    box-shadow: 
        inset -30px -30px 80px rgba(0,0,0,0.8),
        inset 20px 20px 60px rgba(0, 150, 255, 0.2),
        0 0 100px rgba(0, 150, 255, 0.1);
    animation: spinEarth 30s linear infinite;
    position: relative;
    overflow: hidden;
}

/* ===== CONTINENTS (Fake) ===== */
.earth::before {
    content: '';
    position: absolute;
    top: 20%;
    left: 15%;
    width: 30%;
    height: 20%;
    background: radial-gradient(ellipse at 50% 50%, rgba(0, 200, 100, 0.35), transparent 70%);
    border-radius: 40% 60% 30% 70%;
    box-shadow: 0 0 30px rgba(0, 200, 100, 0.05);
}

.earth::after {
    content: '';
    position: absolute;
    bottom: 25%;
    right: 20%;
    width: 25%;
    height: 18%;
    background: radial-gradient(ellipse at 50% 50%, rgba(0, 200, 100, 0.2), transparent 70%);
    border-radius: 50% 30% 60% 40%;
}

/* ===== GLOW RINGS ===== */
.ring {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 520px;
    height: 520px;
    transform: translate(-50%, -50%);
    border: 1.5px solid rgba(0, 255, 255, 0.06);
    border-radius: 50%;
    animation: spinRing 35s linear infinite;
    z-index: -1;
}

.ring2 {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 680px;
    height: 680px;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(0, 255, 255, 0.03);
    border-radius: 50%;
    animation: spinRing 50s linear infinite reverse;
    z-index: -1;
}

/* ===== ANIMATIONS ===== */
@keyframes spinEarth {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

@keyframes spinRing {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
}

/* ===== GRID (Optional) ===== */
.grid {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
        linear-gradient(rgba(0, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.015) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: -1;
}

/* ===== PARTICLES ===== */
.particle {
    position: fixed;
    width: 2px;
    height: 2px;
    background: rgba(0, 255, 255, 0.2);
    border-radius: 50%;
    animation: floatUp 20s infinite linear;
    z-index: -1;
    pointer-events: none;
}
</style>

<!-- ===== HTML ===== -->
<div class="grid"></div>
<div class="ring"></div>
<div class="ring2"></div>
<div class="earth-container">
    <div class="earth"></div>
</div>

<!-- ===== STARS (50 random stars) ===== -->
<script>
(function() {
    const body = document.body;
    // Stars
    for (let i = 0; i < 150; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.width = (1 + Math.random() * 3) + 'px';
        s.style.height = s.style.width;
        s.style.animationDelay = (Math.random() * 5) + 's';
        s.style.animationDuration = (2 + Math.random() * 4) + 's';
        body.appendChild(s);
    }
    // Particles
    for (let i = 0; i < 40; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (15 + Math.random() * 20) + 's';
        p.style.animationDelay = (Math.random() * 20) + 's';
        p.style.width = (2 + Math.random() * 4) + 'px';
        p.style.height = p.style.width;
        body.appendChild(p);
    }
})();
</script>
