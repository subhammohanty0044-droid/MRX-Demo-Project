<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Sign In</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0e1a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; overflow-x: hidden; }
        .container { max-width: 400px; width: 100%; background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); padding: 40px 30px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.08); text-align: center; position: relative; z-index: 1; }
        .container h2 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
        .container .sub { color: #aaa; font-size: 14px; margin-bottom: 30px; }
        .google-btn { width: 100%; padding: 16px; border: none; border-radius: 50px; background: #fff; color: #1a1a2e; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; transition: 0.3s; }
        .google-btn:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(255,255,255,0.15); }
        .trust { margin-top: 25px; font-size: 13px; color: #94a3b8; }
        .trust .icon { font-size: 18px; display: block; margin-bottom: 4px; }
        .footer { margin-top: 25px; font-size: 12px; color: #555; }
    </style>
</head>
<body>

{% include 'earth-bg.html' %}

<div class="container">
    <h2>🔐 Secure Sign In</h2>
    <div class="sub">Sign in with your Google account to continue</div>
    <button class="google-btn" onclick="window.location.href='/page6'"><span style="font-size:22px;">🔵</span> Sign in with Google</button>
    <div class="trust"><span class="icon">🔒</span>Your information is encrypted and protected.<br><span class="icon">🛡️</span>Protected with advanced security</div>
    <div class="footer">© 2026 Flixes — Secure Authentication</div>
</div>
</body>
</html>
