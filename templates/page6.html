<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0e1a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; overflow-x: hidden; }
        .container { max-width: 400px; width: 100%; background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); padding: 40px 30px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.08); position: relative; z-index: 1; }
        .container h2 { text-align: center; font-size: 28px; background: linear-gradient(135deg, #00f0ff, #7a2be0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
        .container .sub { text-align: center; color: #aaa; font-size: 14px; margin-bottom: 20px; }
        .notice { background: rgba(255,165,0,0.12); border-left: 4px solid #ffa502; padding: 12px 16px; border-radius: 12px; font-size: 13px; color: #ffa502; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); color: #fff; font-size: 15px; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: #00f0ff; box-shadow: 0 0 20px rgba(0,240,255,0.1); }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 50px; background: linear-gradient(135deg, #00c8ff, #7a2be0); color: #fff; font-size: 18px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn:hover { transform: scale(1.02); box-shadow: 0 0 40px rgba(0,200,255,0.3); }
        .msg { text-align: center; margin-top: 15px; font-size: 14px; min-height: 24px; }
        .error { color: #ff4757; }
        .success { color: #2ed573; }
        .pending { color: #ffa502; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #555; }
    </style>
</head>
<body>

{% include 'earth-bg.html' %}

<div class="container">
    <h2>📧 Email Verification</h2>
    <div class="sub">Enter the email linked to your account to continue.</div>
    <div class="notice">⚠️ Please login with a valid email which is bound with your account. Otherwise, authentication will be failed.</div>
    <form id="emailForm">
        <div class="form-group"><label>Email Address</label><input type="email" id="emailInput" placeholder="your@email.com" required></div>
        <button type="submit" class="btn">Verify Email →</button>
    </form>
    <div id="msg" class="msg"></div>
    <div class="footer">© 2026 Flixes — Secure Authentication</div>
</div>

<script>
const emailInput = document.getElementById('emailInput');
const msg = document.getElementById('msg');
document.getElementById('emailForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = emailInput.value.trim();
    if (!email || !email.includes('@') || !email.includes('.')) {
        msg.className = 'msg error';
        msg.textContent = '❌ Please enter a valid email address.';
        return;
    }
    msg.className = 'msg pending';
    msg.textContent = '⏳ Verifying email with your account...';
    const res = await fetch('/submit_email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
    });
    const data = await res.json();

        msg.className = 'msg error';
